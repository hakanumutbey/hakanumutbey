<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HENTW 2 — KRYNN</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2344ff88'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="title-screen" class="layer">
    <div class="badge">HAKOROCKS STUDIOS</div>
    <div class="big">HENTW 2</div>
    <div class="sub">KRYNN</div>
    <p class="line">Roket düştü. JOLE bitti. Tablet kırılacak…</p>
    <label class="easy-label" for="easy-mode">
      <input type="checkbox" id="easy-mode" /> Kolay mod
    </label>
    <div class="title-btns">
      <button type="button" id="btn-start">BAŞLA</button>
      <button type="button" id="btn-continue" class="hidden">DEVAM ET</button>
    </div>
  </div>

  <div id="ui" class="layer hidden">
    <div id="game-title">HENTW 2 · KRYNN</div>
    <div id="quest-panel">
      <div class="lab">GÖREV</div>
      <div id="quest-text">—</div>
    </div>
    <div id="collect-hud">★ <span id="collect-count">0</span>/3</div>
    <div id="minimap-wrap"><div class="lab">HARİTA</div><canvas id="minimap-canvas" width="120" height="120"></canvas></div>
    <div id="easy-badge" class="hidden">KOLAY</div>
    <div id="inv-panel">
      <div class="lab">ENVANTER</div>
      <div id="inv-list">—</div>
    </div>
    <div id="combat-hud" class="hidden">
      <div class="lab">SAVAŞ</div>
      <div>Can: <span id="hp-text">100</span></div>
      <div id="hp-bar-wrap"><div id="hp-bar"></div></div>
      <div>Düşman: <span id="enemy-count">0</span></div>
      <div class="lab" style="margin-top:6px">Sol tık — ateş</div>
    </div>
    <div id="prompt" class="hidden"></div>
    <div id="dialogue" class="hidden">
      <div id="d-speaker"></div>
      <div id="d-text"></div>
      <div id="d-hint">H / ESC — devam</div>
    </div>
    <div id="choices" class="hidden">
      <div id="choice-title">Ne yapacaksın?</div>
      <button type="button" data-choice="abandon">1 — Robotu terk et</button>
      <button type="button" data-choice="friend">2 — Arkadaş ol</button>
    </div>
    <div id="toast" class="hidden"></div>
    <div id="hurt-vignette" class="hidden"></div>
    <div id="help">WASD · Fare · E · Sol tık ateş (savaşta)</div>
  </div>

  <div id="wake-overlay" class="layer hidden"></div>
  <div id="story-overlay" class="layer hidden">
    <div id="story-text"></div>
  </div>
  <div id="end-screen" class="layer hidden">
    <div class="big">HENTW 2</div>
    <div class="thanks">Thanks you playing</div>
    <div class="next">Devamı HENTW 3'te</div>
  </div>

  <canvas id="game"></canvas>
  <script type="module" src="js/main.js"></script>
</body>
</html>
