<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Make City v2.0 — 3D'ye Geçiş</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #0b171d;
    color: #fff;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ---- Ana menü ---- */
  #menu {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 18px;
    background: radial-gradient(circle at 50% 30%, #1c3d4d, #0b171d);
    z-index: 10;
    text-align: center;
    padding: 20px;
  }
  #menu h1 { font-size: clamp(34px, 7vw, 64px); letter-spacing: 2px; }
  #menu h1 span { color: #ffd54f; }
  #menu p { color: #b0bec5; max-width: 520px; }
  .mode-btn {
    font-size: 22px;
    padding: 16px 34px;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    color: #08222e;
    font-weight: 700;
    width: min(340px, 86vw);
    transition: transform .12s, box-shadow .12s;
  }
  .mode-btn:hover { transform: translateY(-3px) scale(1.02); }
  .mode-btn small { display: block; font-size: 13px; font-weight: 500; margin-top: 4px; opacity: .75; }
  #btn-infinite { background: linear-gradient(135deg, #ffd54f, #ffb300); box-shadow: 0 8px 24px #ffb30055; }
  #btn-economy  { background: linear-gradient(135deg, #69f0ae, #00c853); box-shadow: 0 8px 24px #00c85355; }

  /* ---- Oyun arayüzü ---- */
  #game-wrap { display: none; position: fixed; inset: 0; }
  canvas { display: block; }

  #hud {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; gap: 10px; flex-wrap: wrap;
    align-items: center; justify-content: center;
    padding: 8px 12px;
    background: linear-gradient(#00000099, transparent);
    font-size: 15px;
    pointer-events: none;
    z-index: 3;
  }
  .hud-item { background: #00000088; border-radius: 10px; padding: 5px 12px; white-space: nowrap; }
  #hud-msg { color: #ffd54f; font-weight: 600; }
  .hud-btn {
    background: #ef5350; color: #fff; border: none; border-radius: 10px;
    padding: 5px 12px; cursor: pointer; font-weight: 600; pointer-events: auto;
  }
  #fs-btn { background: #455a64; }

  #toolbar {
    position: absolute; bottom: 0; left: 0; right: 0;
    display: flex; gap: 8px; flex-wrap: wrap;
    justify-content: center;
    padding: 10px;
    background: linear-gradient(transparent, #00000099);
    z-index: 3;
  }
  .tool {
    border: 2px solid transparent;
    background: #00000088;
    color: #fff;
    border-radius: 12px;
    padding: 8px 10px;
    cursor: pointer;
    font-size: 14px;
    text-align: center;
    min-width: 76px;
    transition: transform .1s, background .1s;
  }
  .tool:hover { background: #ffffff2a; }
  .tool.selected { border-color: #ffd54f; background: #ffd54f22; transform: scale(1.06); }
  .tool .emoji { font-size: 22px; display: block; }
  .tool .cost { display: block; font-size: 11px; color: #ffd54f; }

  #cam-help {
    position: absolute; right: 10px; top: 54px;
    background: #00000077; border-radius: 10px;
    padding: 6px 12px; font-size: 12px; color: #b0bec5;
    z-index: 3; pointer-events: none;
  }
</style>
</head>
<body>

<div id="menu">
  <h1>🏙️ Make <span>City</span> <small style="font-size:20px; color:#b0bec5;">v2.0</small></h1>
  <p>Kendi şehrini 3D kur! Kamerayı döndür, yaklaş, yol döşe, evler ve dükkanlar yap. Hastaneni unutma — yoksa hastalar komşu şehre gider, parasını da onlar kazanır!</p>
  <button class="mode-btn" id="btn-infinite">💰 Sonsuz Para
    <small>Her şey bedava, rahat rahat kur!</small>
  </button>
  <button class="mode-btn" id="btn-economy">📊 Ekonomi
    <small>1.000.000₺ ile başla, vergilerle şehri büyüt!</small>
  </button>
</div>

<div id="game-wrap">
  <div id="hud">
    <span class="hud-item" id="hud-day">📅 Gün 1</span>
    <span class="hud-item" id="hud-money">💰 —</span>
    <span class="hud-item" id="hud-pop">👨‍👩‍👧 Nüfus: 0</span>
    <span class="hud-item" id="hud-happy">😊 —</span>
    <span class="hud-item" id="hud-msg"></span>
    <button class="hud-btn" id="fs-btn">⛶ Tam Ekran</button>
    <button class="hud-btn" id="new-game-btn">↺ Yeni Oyun</button>
  </div>
  <div id="cam-help">🖱️ Sol tık: inşa · Sağ sürükle: döndür · Tekerlek: yakınlaş · Shift+sağ: kaydır</div>
  <div id="toolbar"></div>
</div>

<script type="module">
import * as THREE from "./lib/three.module.min.js";

// ---------- Ayarlar ----------
const COLS = 22, ROWS = 13, TILE = 2;
const DAY_MS = 12000; // 1 gün = 12 saniye

const TOOLS = [
  { id: "road",     name: "Yol",     emoji: "🛣️", cost: 10000 },
  { id: "house",    name: "Ev",      emoji: "🏠", cost: 50000 },
  { id: "shop",     name: "Dükkan",  emoji: "🏪", cost: 100000 },
  { id: "hospital", name: "Hastane", emoji: "🏥", cost: 300000 },
  { id: "park",     name: "Park",    emoji: "🌳", cost: 20000 },
  { id: "bulldoze", name: "Yık",     emoji: "🚜", cost: 0 },
];

const INCOME_HOUSE = 5000;    // çalışan ev başına günlük vergi
const INCOME_SHOP = 15000;    // çalışan dükkan başına günlük kazanç
const HOSPITAL_EARN = 3000;   // hastane varken ev başına hasta geliri
const HOSPITAL_LOSS = 5000;   // hastane yokken ev başına hasta kaçış zararı
const PARK_BONUS = 0.05;      // park başına gelir bonusu (+%5)

// ---------- Durum ----------
let mode = null;
let grid = [];               // grid[r][c] = null | { type, mesh }
let money = 0;
let day = 1;
let selectedTool = "road";
let messageUntil = 0;
let lastTick = 0;

function newGrid() {
  grid = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
}

function isBuilding(t) { return t === "house" || t === "shop" || t === "hospital" || t === "park"; }

function hasRoadNextTo(r, c) {
  return [[1,0],[-1,0],[0,1],[0,-1]].some(([dr,dc]) => {
    const nr = r + dr, nc = c + dc;
    return nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && grid[nr][nc]?.type === "road";
  });
}

function cityStats() {
  let houses = 0, workingHouses = 0, shops = 0, workingShops = 0, parks = 0, hospitals = 0;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const cell = grid[r][c];
    if (!cell) continue;
    const t = cell.type;
    if (t === "house") { houses++; if (hasRoadNextTo(r, c)) workingHouses++; }
    else if (t === "shop") { shops++; if (hasRoadNextTo(r, c)) workingShops++; }
    else if (t === "park" && hasRoadNextTo(r, c)) parks++;
    else if (t === "hospital" && hasRoadNextTo(r, c)) hospitals++;
  }
  return { houses, workingHouses, shops, workingShops, parks, hospitals };
}

function say(text, ms = 5000) {
  messageUntil = performance.now() + ms;
  document.getElementById("hud-msg").textContent = text;
}

// ---------- 3D Sahne ----------
const wrap = document.getElementById("game-wrap");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
wrap.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 70, 400);

const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 500);

scene.add(new THREE.HemisphereLight(0xeaf6ff, 0x2e4d1e, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(30, 50, 20);
scene.add(sun);

// zemin (ufka kadar)
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(2000, 2000),
  new THREE.MeshLambertMaterial({ color: 0x4a7c2f })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// ızgara çizgileri
const gridHelper = new THREE.GridHelper(Math.max(COLS, ROWS) * TILE, Math.max(COLS, ROWS), 0x2e4d1e, 0x3c6427);
gridHelper.position.y = 0.01;
scene.add(gridHelper);

// şehir katmanı (binalar buraya eklenir)
const cityLayer = new THREE.Group();
scene.add(cityLayer);

// fare vurgusu
const hoverMark = new THREE.Mesh(
  new THREE.PlaneGeometry(TILE * 0.96, TILE * 0.96),
  new THREE.MeshBasicMaterial({ color: 0xffd54f, transparent: true, opacity: 0.35 })
);
hoverMark.rotation.x = -Math.PI / 2;
hoverMark.position.y = 0.03;
hoverMark.visible = false;
scene.add(hoverMark);

// ---------- Kamera kontrolü (şehir oyunu tarzı) ----------
const cam = { theta: Math.PI / 4, phi: 0.9, radius: 42, target: new THREE.Vector3(0, 0, 0) };

function updateCamera() {
  const { theta, phi, radius, target } = cam;
  camera.position.set(
    target.x + radius * Math.sin(phi) * Math.sin(theta),
    target.y + radius * Math.cos(phi),
    target.z + radius * Math.sin(phi) * Math.cos(theta)
  );
  camera.lookAt(target);
}

function clampCam() {
  cam.phi = Math.max(0.25, Math.min(1.35, cam.phi));
  cam.radius = Math.max(8, Math.min(90, cam.radius));
  cam.target.x = Math.max(-COLS * TILE / 2, Math.min(COLS * TILE / 2, cam.target.x));
  cam.target.z = Math.max(-ROWS * TILE / 2, Math.min(ROWS * TILE / 2, cam.target.z));
}

// ---------- Bina modelleri ----------
function makeRoadMesh() {
  const g = new THREE.Group();
  const asphalt = new THREE.Mesh(
    new THREE.BoxGeometry(TILE, 0.08, TILE),
    new THREE.MeshLambertMaterial({ color: 0x37474f })
  );
  asphalt.position.y = 0.04;
  g.add(asphalt);
  return g;
}

// Yol şeritleri: komşu yollara göre ortadan kenarlara beyaz çizgiler
function refreshRoadMarkings(r, c) {
  const cell = grid[r][c];
  if (!cell || cell.type !== "road") return;
  const g = cell.mesh;
  // eski şeritleri temizle (asfalt hariç)
  while (g.children.length > 1) g.remove(g.children[g.children.length - 1]);
  const lineMat = new THREE.MeshBasicMaterial({ color: 0xf5f5f5 });
  const dirs = [
    { dr: -1, dc: 0, rot: 0, x: 0, z: -TILE / 4 },
    { dr: 1, dc: 0, rot: 0, x: 0, z: TILE / 4 },
    { dr: 0, dc: -1, rot: Math.PI / 2, x: -TILE / 4, z: 0 },
    { dr: 0, dc: 1, rot: Math.PI / 2, x: TILE / 4, z: 0 },
  ];
  for (const d of dirs) {
    const nr = r + d.dr, nc = c + d.dc;
    if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) continue;
    if (grid[nr][nc]?.type !== "road") continue;
    const line = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.02, TILE / 2), lineMat);
    line.rotation.y = d.rot;
    line.position.set(d.x, 0.09, d.z);
    g.add(line);
  }
}

function makeHouseMesh() {
  const g = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(1.3, 0.9, 1.3),
    new THREE.MeshLambertMaterial({ color: 0xa1887f })
  );
  body.position.y = 0.45;
  g.add(body);
  const roof = new THREE.Mesh(
    new THREE.ConeGeometry(1.15, 0.7, 4),
    new THREE.MeshLambertMaterial({ color: 0x8d3b2f })
  );
  roof.rotation.y = Math.PI / 4;
  roof.position.y = 1.25;
  g.add(roof);
  return g;
}

function makeShopMesh() {
  const g = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(1.5, 1.2, 1.5),
    new THREE.MeshLambertMaterial({ color: 0x5c6bc0 })
  );
  body.position.y = 0.6;
  g.add(body);
  const sign = new THREE.Mesh(
    new THREE.BoxGeometry(1.1, 0.3, 0.1),
    new THREE.MeshLambertMaterial({ color: 0xffd54f })
  );
  sign.position.set(0, 1.0, 0.78);
  g.add(sign);
  return g;
}

function makeHospitalMesh() {
  const g = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(1.6, 1.4, 1.6),
    new THREE.MeshLambertMaterial({ color: 0xfafafa })
  );
  body.position.y = 0.7;
  g.add(body);
  const crossMat = new THREE.MeshLambertMaterial({ color: 0xe53935 });
  const h = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.22, 0.22), crossMat);
  const v = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.7, 0.22), crossMat);
  h.position.set(0, 1.62, 0); v.position.set(0, 1.62, 0);
  g.add(h, v);
  return g;
}

function makeParkMesh() {
  const g = new THREE.Group();
  const base = new THREE.Mesh(
    new THREE.CylinderGeometry(0.95, 0.95, 0.06, 20),
    new THREE.MeshLambertMaterial({ color: 0x66bb6a })
  );
  base.position.y = 0.03;
  g.add(base);
  const leafMat = new THREE.MeshLambertMaterial({ color: 0x2e7d32 });
  const trunkMat = new THREE.MeshLambertMaterial({ color: 0x6d4c41 });
  for (const [x, z] of [[-0.4, -0.3], [0.45, -0.15], [0, 0.45]]) {
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.35), trunkMat);
    trunk.position.set(x, 0.2, z);
    const leaf = new THREE.Mesh(new THREE.ConeGeometry(0.28, 0.7, 8), leafMat);
    leaf.position.set(x, 0.72, z);
    g.add(trunk, leaf);
  }
  return g;
}

const MESH_MAKERS = {
  road: makeRoadMesh,
  house: makeHouseMesh,
  shop: makeShopMesh,
  hospital: makeHospitalMesh,
  park: makeParkMesh,
};

function cellToWorld(r, c) {
  return { x: (c - COLS / 2 + 0.5) * TILE, z: (r - ROWS / 2 + 0.5) * TILE };
}

// ---------- İnşa / yıkım ----------
function applyTool(r, c) {
  const tool = TOOLS.find(t => t.id === selectedTool);
  if (!tool) return;
  const current = grid[r][c];

  if (tool.id === "bulldoze") {
    if (!current) return;
    // Yıkım bedava; binanın parasının yarısını iade alırsın
    if (mode === "economy") {
      const refund = Math.floor((TOOLS.find(t => t.id === current.type)?.cost || 0) / 2);
      money += refund;
      if (refund > 0) say(`🚜 Yıkıldı, iade: +${refund.toLocaleString("tr-TR")}₺`);
    }
    cityLayer.remove(current.mesh);
    grid[r][c] = null;
    // komşu yolların şeritlerini tazele
    refreshNeighborRoads(r, c);
    return;
  }

  if (current) return;
  if (mode === "economy" && money < tool.cost) { say(`💸 ${tool.name} için ${tool.cost.toLocaleString("tr-TR")}₺ lazım, paran yetmiyor!`); return; }

  const mesh = MESH_MAKERS[tool.id]();
  const pos = cellToWorld(r, c);
  mesh.position.set(pos.x, 0, pos.z);
  cityLayer.add(mesh);
  grid[r][c] = { type: tool.id, mesh };
  if (mode === "economy") money -= tool.cost;

  if (tool.id === "road") refreshNeighborRoads(r, c);
  else if (isBuilding(tool.id) && !hasRoadNextTo(r, c)) {
    say("⚠️ Bu bina yola bağlı değil, çalışmaz! Yanına yol yap.");
  }
}

function refreshNeighborRoads(r, c) {
  refreshRoadMarkings(r, c);
  for (const [dr, dc] of [[1,0],[-1,0],[0,1],[0,-1]]) {
    const nr = r + dr, nc = c + dc;
    if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) refreshRoadMarkings(nr, nc);
  }
}

// ---------- Gün döngüsü ----------
function tickDay() {
  day++;
  if (mode !== "economy") return;

  const s = cityStats();
  const parkBonus = 1 + Math.min(s.parks * PARK_BONUS, 0.5);
  let income = Math.round((s.workingHouses * INCOME_HOUSE + s.workingShops * INCOME_SHOP) * parkBonus);
  let hospitalDiff = 0;

  if (s.workingHouses > 0) {
    if (s.hospitals > 0) {
      hospitalDiff = s.workingHouses * HOSPITAL_EARN;
      say(`🏥 Hastanen çalışıyor: hasta geliri +${hospitalDiff.toLocaleString("tr-TR")}₺`);
    } else {
      hospitalDiff = -s.workingHouses * HOSPITAL_LOSS;
      say(`🚑 Hastane yok! Hastalar komşu şehre gitti: ${hospitalDiff.toLocaleString("tr-TR")}₺`);
    }
  } else {
    say("📅 Yeni gün! Ev yap ki vergi topla.");
  }

  money += income + hospitalDiff;
  if (money < 0) say("⚠️ Belediye borçta! Dükkan ve evlerle geliri artır.");
}

// ---------- Fare / dokunma ----------
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let hovered = null;
let dragButton = -1;
let lastX = 0, lastY = 0;
let pinchDist = 0;

function pickCell(clientX, clientY) {
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObject(ground)[0];
  if (!hit) return null;
  const c = Math.floor((hit.point.x + COLS * TILE / 2) / TILE);
  const r = Math.floor((hit.point.z + ROWS * TILE / 2) / TILE);
  if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return null;
  return { r, c };
}

wrap.addEventListener("contextmenu", e => e.preventDefault());

wrap.addEventListener("pointerdown", e => {
  if (e.pointerType === "touch") return;
  dragButton = e.button;
  lastX = e.clientX; lastY = e.clientY;
  if (e.button === 0) {
    const cell = pickCell(e.clientX, e.clientY);
    if (cell) applyTool(cell.r, cell.c);
  }
});

wrap.addEventListener("pointermove", e => {
  if (e.pointerType === "touch") return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;

  if (dragButton === 2) { // sağ sürükle: döndür (+Shift: kaydır)
    if (e.shiftKey) {
      panBy(dx, dy);
    } else {
      cam.theta -= dx * 0.006;
      cam.phi -= dy * 0.004;
      clampCam();
    }
  } else if (dragButton === 1) { // orta tuş: kaydır
    panBy(dx, dy);
  } else if (dragButton === -1) {
    hovered = pickCell(e.clientX, e.clientY);
  }
});

wrap.addEventListener("pointerup", () => { dragButton = -1; });

wrap.addEventListener("wheel", e => {
  e.preventDefault();
  cam.radius *= e.deltaY > 0 ? 1.1 : 0.9;
  clampCam();
}, { passive: false });

function panBy(dx, dy) {
  // ekran hareketini zemine çevir
  const right = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 0);
  const fwd = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 2);
  fwd.y = 0; fwd.normalize();
  const scale = cam.radius * 0.0016;
  cam.target.addScaledVector(right, -dx * scale);
  cam.target.addScaledVector(fwd, dy * scale * 2);
  clampCam();
}

// dokunmatik: tek parmak inşa, iki parmak döndür+yakınlaş
wrap.addEventListener("touchstart", e => {
  if (e.touches.length === 1) {
    const t = e.touches[0];
    const cell = pickCell(t.clientX, t.clientY);
    if (cell) applyTool(cell.r, cell.c);
    lastX = t.clientX; lastY = t.clientY;
  } else if (e.touches.length === 2) {
    pinchDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
  }
}, { passive: true });

wrap.addEventListener("touchmove", e => {
  if (e.touches.length === 2) {
    const t = e.touches[0];
    cam.theta -= (t.clientX - lastX) * 0.006;
    lastX = t.clientX; lastY = t.clientY;
    const d = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    cam.radius *= pinchDist / d;
    pinchDist = d;
    clampCam();
  }
  e.preventDefault();
}, { passive: false });

// ---------- HUD ----------
function updateHud() {
  const s = cityStats();
  const population = s.workingHouses * 4;
  document.getElementById("hud-day").textContent = `📅 Gün ${day}`;
  document.getElementById("hud-money").textContent =
    mode === "economy" ? `💰 ${money.toLocaleString("tr-TR")}₺` : "💰 Sonsuz";
  document.getElementById("hud-pop").textContent = `👨‍👩‍👧 Nüfus: ${population}`;

  let happy = "😐 Şehir boş";
  if (s.workingHouses > 0) {
    const parkRatio = s.parks / s.workingHouses;
    happy = parkRatio >= 0.5 ? "😄 Çok mutlu" : parkRatio >= 0.25 ? "🙂 Mutlu" : "😕 Park istiyorlar";
    if (s.hospitals === 0) happy += " + 🚑 Hastane yok!";
  }
  document.getElementById("hud-happy").textContent = `😊 ${happy}`;

  if (performance.now() > messageUntil) {
    document.getElementById("hud-msg").textContent = "";
  }
}

// ---------- Araç çubuğu ----------
function buildToolbar() {
  const bar = document.getElementById("toolbar");
  bar.innerHTML = "";
  for (const t of TOOLS) {
    const btn = document.createElement("button");
    btn.className = "tool" + (t.id === selectedTool ? " selected" : "");
    const costLabel = t.id === "bulldoze"
      ? (mode === "economy" ? "%50 iade" : "bedava")
      : (mode === "economy" ? t.cost.toLocaleString("tr-TR") + "₺" : "bedava");
    btn.innerHTML = `<span class="emoji">${t.emoji}</span>${t.name}<span class="cost">${costLabel}</span>`;
    btn.onclick = () => { selectedTool = t.id; buildToolbar(); };
    bar.appendChild(btn);
  }
}

// ---------- Boyutlandırma ----------
function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize);

// ---------- Ana döngü ----------
function loop(now) {
  requestAnimationFrame(loop);
  if (!mode) return;
  if (now - lastTick >= DAY_MS) { lastTick = now; tickDay(); updateHud(); }
  if (hovered) {
    const pos = cellToWorld(hovered.r, hovered.c);
    hoverMark.position.set(pos.x, 0.03, pos.z);
    hoverMark.visible = true;
  } else {
    hoverMark.visible = false;
  }
  updateCamera();
  renderer.render(scene, camera);
}

// ---------- Tam ekran ----------
function goFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  }
}
document.getElementById("fs-btn").onclick = goFullscreen;

// ---------- Başlangıç ----------
function startGame(selectedMode) {
  mode = selectedMode;
  // eski şehri temizle
  while (cityLayer.children.length) cityLayer.remove(cityLayer.children[0]);
  newGrid();
  day = 1;
  money = mode === "economy" ? 1000000 : Infinity;
  selectedTool = "road";
  lastTick = performance.now();

  document.getElementById("menu").style.display = "none";
  document.getElementById("game-wrap").style.display = "block";
  resize();
  buildToolbar();
  updateHud();
  goFullscreen();
  say(mode === "economy"
    ? "📊 Ekonomi modu: 1.000.000₺ bütçen var. Önce yol, sonra ev!"
    : "💰 Sonsuz para modu: her şey bedava, hayal gücün serbest!", 7000);
}

document.getElementById("btn-infinite").onclick = () => startGame("infinite");
document.getElementById("btn-economy").onclick = () => startGame("economy");
document.getElementById("new-game-btn").onclick = () => {
  document.getElementById("game-wrap").style.display = "none";
  document.getElementById("menu").style.display = "flex";
  if (document.fullscreenElement) document.exitFullscreen();
};

newGrid();
requestAnimationFrame(loop);
</script>
<script src="versiyon.js"></script>
<script>initVersionPicker("2.0");</script>
</body>
