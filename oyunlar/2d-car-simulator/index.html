<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0b0d10" />
    <title>2D Car Simulator — Hakorocks Studio</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-wrap">
      <header class="game-top">
        <h1>2D Car Simulator</h1>
        <div class="hud">
          <span id="hud-level">Bölüm 1/100</span>
          <span id="hud-tries">Deneme 1</span>
        </div>
      </header>

      <div class="stage">
        <canvas id="game" width="800" height="480"></canvas>
        <div class="overlay" id="overlay">
          <div class="overlay-content" id="overlay-content"></div>
        </div>
      </div>

      <div class="actions">
        <p class="hint" id="hint">Basılı tut, çizgiyi çiz, bırak. Araba dümdüz gider!</p>
        <div class="action-buttons">
          <button id="music-toggle" type="button" aria-label="Müzik aç/kapat">🎵</button>
          <button id="menu-button" type="button">☰ Menü</button>
          <button id="reset" type="button">↺ Baştan</button>
        </div>
      </div>
    </main>
    <script src="game.js"></script>
  </body>
</html>
