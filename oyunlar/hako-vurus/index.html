<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#08060c" />
    <title>Hako Vuruş — Hakorocks Studio</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="wrap">
      <header class="top">
        <div>
          <p class="eyebrow">Hakorocks · Aksiyon</p>
          <h1>Hako Vuruş</h1>
          <p class="tag">Yumrukla, atıl, combo patlat. Dalgalar durmaz.</p>
        </div>
        <div class="best-box" aria-label="En iyi skor">
          <span>Rekor</span>
          <strong id="bestLabel">0</strong>
        </div>
      </header>

      <section class="stage">
        <canvas id="game" width="960" height="540" aria-label="Hako Vuruş arena"></canvas>
        <div class="hud" id="hud" hidden>
          <div><span>Dalga</span><strong id="waveLabel">1</strong></div>
          <div><span>Skor</span><strong id="scoreLabel">0</strong></div>
          <div><span>Combo</span><strong id="comboLabel">0</strong></div>
          <div class="hp-wrap">
            <span>Can</span>
            <div class="hp-bar"><i id="hpFill"></i></div>
          </div>
        </div>
        <div class="overlay" id="overlay">
          <div class="overlay-card" id="overlayCard"></div>
        </div>
      </section>

      <p class="hint">
        <strong>A / D</strong> hareket · <strong>W</strong> zıpla ·
        <strong>J / Boşluk</strong> vur · <strong>K / Shift</strong> atıl ·
        6 combo = özel vuruş
      </p>
    </main>
    <script src="game.js"></script>
  </body>
</html>
