<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#07060f" />
    <title>Vespera — Hakorocks Studio</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="wrap">
      <header class="top">
        <div>
          <p class="eyebrow">Hakorocks · Uzay hikaye</p>
          <h1>Vespera</h1>
          <p class="tag">Tek gezegen. Uzun yol. Ters köşe.</p>
        </div>
        <div class="region-box" aria-live="polite">
          <span>Bölge</span>
          <strong id="regionLabel">—</strong>
        </div>
      </header>

      <section class="stage">
        <canvas id="game" width="960" height="540" aria-label="Vespera gezegeni"></canvas>
        <div class="hud" id="hud" hidden>
          <div class="hp-wrap">
            <span>Can</span>
            <div class="hp-bar"><i id="hpFill"></i></div>
          </div>
          <div>
            <span>Hedef</span>
            <strong id="questLabel">—</strong>
          </div>
        </div>
        <aside class="log" id="storyLog" hidden></aside>
        <div class="overlay" id="overlay">
          <div class="overlay-card" id="overlayCard"></div>
        </div>
      </section>

      <p class="hint" id="fileHint">
        <strong>WASD</strong> yürü · <strong>E</strong> konuş / topla ·
        <strong>J / Boşluk</strong> ateş · ilerleme kaydedilir
      </p>
    </main>
    <script src="logic.js"></script>
    <script src="game.js"></script>
  </body>
</html>
